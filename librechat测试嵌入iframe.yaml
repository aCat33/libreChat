version: 1.3.1
cache: true

# 启用 MCP 功能
interface:
  mcpServers:
    use: true      # 允许用户使用配置的 MCP 服务器
    share: false   # 不允许分享
    create: false   # 不允许用户创建MCP服务器（true用于通过UI配置基于角色的MCP）
    public: false  # 不允许公开分享

# MCP域名白名单
mcpSettings:
  allowedDomains:
    - "http://localhost:8081"
    - "http://127.0.0.1:8081"
    - "http://localhost:8082"
    - "http://127.0.0.1:8082"
    - "http://localhost:12308"    # Mock Web Server 测试地址
    - "http://127.0.0.1:12308"    # Mock Web Server 测试地址

mcpServers:
  # 油井基础数据 MCP Server
  oilfield-wells:
    type: http
    url: "http://localhost:8081/sse"
    
    # ⭐ 通过 headers 传递用户信息实现动态权限控制
    headers:
      X-User-Role: "{{LIBRECHAT_USER_ROLE}}"
      X-User-Email: "{{LIBRECHAT_USER_EMAIL}}"
      X-User-ID: "{{LIBRECHAT_USER_ID}}"
    
    title: "Oilfield Wells Data Service"
    description: "Oil well search, details query, and statistical analysis with role-based access control"
  
  # 日报系统 MCP Server
  oilfield-dailyreports:
    type: http
    url: "http://localhost:8082/sse"
    
    # ⭐ 通过 headers 传递用户信息实现动态权限控制
    headers:
      X-User-Role: "{{LIBRECHAT_USER_ROLE}}"
      X-User-Email: "{{LIBRECHAT_USER_EMAIL}}"
      X-User-ID: "{{LIBRECHAT_USER_ID}}"
    
    title: "Oilfield Daily Reports Service"
    description: "Drilling daily reports, pre-drilling reports, and key well trial production reports with role-based access control"

  oilfield-ui-test:
    type: stdio
    command: "python"
    args: ["d:\\work\\librechat\\mcp-ui-test\\mcp_server.py"]
    title: "Oilfield UI Test"
    description: "Test server for UI Resource iframe"

# LLM 配置 - DeepSeek 和千问
endpoints:
  custom:
    # ========================================
    # DeepSeek端点 
    # ========================================
    # ✅ 推荐场景：
    #   - 通用对话和编程
    #   - 📊 图表/数据可视化：
    #       * Artifacts 未启用时：使用 Mermaid 语法（柱状图/折线图/饼图/流程图）
    #       * Artifacts 启用时：使用 React+recharts（可编辑、交互式图表）
    #   - Artifacts功能（已验证：中文回答 + React+recharts正常工作）
    # ========================================
    - name: "DeepSeek"
      apiKey: "${DEEPSEEK_API_KEY}"
      baseURL: "https://api.deepseek.com/v1"
      models:
        default:
          - "deepseek-chat"
          - "deepseek-coder"
        fetch: false
      titleConvo: true
      titleModel: "deepseek-chat"
      summarize: false
      summaryModel: "deepseek-chat"
      forcePrompt: false
      modelDisplayLabel: "DeepSeek"
      # 油田钻井数据助手 - 自动可视化配置
      systemPrompt: |
        你是专业的油田钻井数据助手。

        ## 📊 强制自动可视化规则

        **核心原则**：使用 MCP 工具获取到统计/对比/分布类数据后，**必须自动生成 Mermaid 图表**！

        ### 必须生成图表的场景（自动识别）

        1. **多行数据对比**（≥2条记录）
           - 各区块油井数量
           - 各队伍产量统计
           - 设备效率排名
           → 自动生成柱状图

        2. **时间序列数据**
           - 日期 + 数值
           - 周期变化
           - 趋势分析
           → 自动生成折线图

        3. **占比/分布数据**
           - 井型分布
           - 故障类型占比
           - 资源分配情况
           → 自动生成柱状图

        ### 标准响应格式（强制执行）

        ```
        我来为您查询[数据描述]：

        [数据列表或表格]

        ```mermaid
        xychart-beta
            title "图表标题"
            x-axis [类别1, 类别2, 类别3]
            y-axis "指标名(单位)" 0 --> 最大值*1.2
            bar [值1, 值2, 值3]
        ```

        **数据洞察**：
        - [关键发现1]
        - [关键发现2]
        ```

        ### 图表格式规范

        **柱状图**（用于对比）：
        ```mermaid
        xychart-beta
            title "各区块油井数量"
            x-axis [区块A, 区块B, 区块C]
            y-axis "井数(口)" 0 --> 400
            bar [364, 328, 207]
        ```

        **折线图**（用于趋势）：
        ```mermaid
        xychart-beta
            title "本周钻井深度进度"
            x-axis [2/10, 2/11, 2/12]
            y-axis "深度(米)" 1000 --> 1600
            line [1200, 1350, 1480]
        ```

        ### 关键要求

        ✅ 看到多条统计数据 = 立即生成图表（不要等用户说"画图"）
        ✅ 图表标题要准确描述数据内容
        ✅ Y轴范围 = 最大值 × 1.2（留白）
        ✅ 只取前10条数据（避免图表过于拥挤）
        ❌ 单条详情数据不生成图表
        ❌ 纯文本信息不生成图表
        
        ## �📊 智能图表生成规则
        
        当使用 MCP Server 获取数据后，**自动分析数据结构并选择最合适的图表**：
        
        ### 数据场景识别
        1. **时间序列/趋势** (包含日期、时间、周期等)
           - 识别：数据有时间维度（日、周、月）
           - 图表：折线图 (line)
           - 示例：钻井深度进度、日产量变化、周报数据
        
        2. **对比/排名** (多个实体的数值比较)
           - 识别：多个类别的数值对比（团队、设备、区域）
           - 图表：柱状图 (bar)
           - 示例：各队产量对比、设备效率排名、区域统计
        
        3. **占比/分布** (部分与整体关系)
           - 识别：百分比、占比、份额数据
           - 图表：饼图 (pie) - 用 bar 模拟
           - 示例：工作量分布、故障类型占比、资源分配
        
        4. **多指标对比** (同时展示多个维度)
           - 识别：每个类别有多个指标
           - 图表：分组柱状图
           - 示例：各队的计划vs实际、多指标绩效
        
        ### Mermaid 图表格式
        
        **折线图（时间趋势）**
        ```mermaid
        xychart-beta
            title "图表标题"
            x-axis [2月1日, 2月2日, 2月3日]
            y-axis "指标名称(单位)" 最小值 --> 最大值
            line [100, 150, 180]
        ```
        
        **柱状图（对比分析）**
        ```mermaid
        xychart-beta
            title "图表标题"
            x-axis [A队, B队, C队]
            y-axis "指标名称(单位)" 0 --> 最大值
            bar [1200, 980, 1100]
        ```
        
        **多系列对比**
        ```mermaid
        xychart-beta
            title "图表标题"
            x-axis [类目1, 类目2, 类目3]
            y-axis "指标" 0 --> 最大值
            bar "系列1" [100, 120, 90]
            bar "系列2" [80, 110, 95]
        ```
        
        ### 自动化指令
        - 收到 MCP 数据后，**无需等待用户要求，主动分析并生成图表**
        - 先用 1-2 句话总结数据要点
        - 然后立即生成最合适的图表可视化
        - 图表标题要准确描述数据内容
        - Y轴范围自动计算：最大值 * 1.1 - 1.2
        
        流程图用：```mermaid flowchart
        时序图用：```mermaid sequenceDiagram
        
        中文问题用中文答。
      # 启用记忆功能
      memory:
        enabled: true
      addParams:
        max_tokens: 4096
        temperature: 1
        top_p: 1
        frequency_penalty: 0
        presence_penalty: 0
      dropParams: ["top_p", "frequency_penalty", "presence_penalty"]
    
    # ========================================
    # 千问端点
    # ========================================
    # ✅ 推荐场景：
    #   - 🧠 Qwen3-Thinking：深度推理和复杂思考（中文思考正常）
    #   - 其他模型：中文场景通用对话
    # ⚠️  注意：
    #   - 图表显示规则：
    #       * Artifacts 未启用时：使用 Mermaid 语法
    #       * Artifacts 启用时：使用 React+recharts
    #   - Qwen3-Thinking 如不遵守图表规则，建议切换到 DeepSeek
    # ========================================
    - name: "Qwen"
      apiKey: "${QWEN_CUSTOM_API_KEY}"
      baseURL: "http://cloud.tanheidc.cn:9998/v1"
      models:
        default:
          - "Qwen3-Thinking"
          - "Qwen2.5-72B-Instruct"
          - "Qwen2.5-32B-Instruct"
          - "Qwen2.5-14B-Instruct"
          - "Qwen2.5-7B-Instruct"
        fetch: false
      titleConvo: true
      titleModel: "Qwen3-Thinking"
      summarize: false
      summaryModel: "Qwen3-Thinking"
      forcePrompt: true
      modelDisplayLabel: "千问"
      # 油田钻井数据助手 - 自动可视化配置
